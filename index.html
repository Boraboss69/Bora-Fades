    const siteName = document.getElementById('siteNameInput').value.trim();
    const ownerEmail = document.getElementById('ownerEmailInput').value.trim();
    await sb.rpc('rpc_update_owner_profile', { p_token: session.token, p_owner_name: ownerName, p_site_name: siteName, p_owner_email: ownerEmail });
    await refreshState(); toast('Gespeichert'); renderAll();
  });
  const pwForm = document.getElementById('pwForm');
  if(pwForm) pwForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const cur = document.getElementById('pwCurrent').value, nw = document.getElementById('pwNew').value, nwConfirm = document.getElementById('pwNewConfirm').value;
    if(nw !== nwConfirm){ toast('Die neuen Passwörter stimmen nicht überein.'); return; }
    const { data } = await sb.rpc('rpc_change_owner_password', { p_token: session.token, p_current: cur, p_new: nw });
    if(data && data.error){ toast('Aktuelles Passwort stimmt nicht.'); return; }
    toast('Passwort aktualisiert'); pwForm.reset();
  });
  const ownerUsernameForm = document.getElementById('ownerUsernameForm');
  if(ownerUsernameForm) ownerUsernameForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const newUsername = document.getElementById('ownerUsernameInput').value.trim();
    const { data } = await sb.rpc('rpc_update_owner_username', { p_token: session.token, p_new_username: newUsername });
    if(!data || data.error === 'taken'){ toast('Dieser Benutzername ist bereits vergeben.'); return; }
    if(data.error === 'invalid_format'){ toast('Nur Buchstaben, Zahlen, "." und "_" erlaubt.'); return; }
    if(data.error === 'cooldown'){ toast('Benutzername kann nur einmal im Monat geändert werden.'); return; }
    await refreshState(); toast('Benutzername geändert'); renderView();
  });
  const addStyleBtn = document.getElementById('addStyleBtn');
  if(addStyleBtn) addStyleBtn.addEventListener('click', async ()=>{
    const input = document.getElementById('newStyleName');
    const name = input.value.trim();
    if(!name){ toast('Bitte einen Namen eingeben.'); return; }
    await sb.rpc('rpc_add_style', { p_token: session.token, p_name: name });
    await refreshState(); toast('Frisur hinzugefügt'); renderAll();
  });
  document.querySelectorAll('[data-style-del]').forEach(b=>b.addEventListener('click', async ()=>{
    if(DATA.styles.length<=1){ toast('Mindestens eine Frisur muss vorhanden sein.'); return; }
    await sb.rpc('rpc_delete_style', { p_token: session.token, p_style_id: b.dataset.styleDel });
    await refreshState(); toast('Frisur entfernt'); renderAll();
  }));

  const newBtn = document.getElementById('newCustBtn');
  if(newBtn) newBtn.addEventListener('click', ()=>{
    openModal(newCustomerModal());
    document.getElementById('createCustBtn').addEventListener('click', (e)=>withLock(e.currentTarget, async ()=>{
      const name = document.getElementById('newCustName').value.trim();
      if(!name){ toast('Bitte einen Namen eingeben.'); return; }
      const email = document.getElementById('newCustEmail').value.trim();
      const { data, error } = await sb.rpc('rpc_create_customer', { p_token: session.token, p_name: name, p_email: email });
      if(error || !data){ toast('Kunde konnte nicht erstellt werden.'); return; }
      await refreshState();
      openModal(inviteResultModal({ name, username: data.username, password: data.password }));
      document.getElementById('closeModalBtn').addEventListener('click', ()=>{ closeModal(); renderAll(); });
      document.getElementById('copyInviteBtn').addEventListener('click', async ()=>{
        const text = document.getElementById('inviteMsg').innerText;
        try{ await navigator.clipboard.writeText(text); toast('Nachricht kopiert'); }
        catch(e){ toast('Kopieren nicht möglich — bitte manuell markieren'); }
      });
    }));
  });
  document.querySelectorAll('[data-cust-view]').forEach(b=>b.addEventListener('click', ()=>{
    const c = custById(b.dataset.custView);
    openModal(customerDetailModal(c));
    document.getElementById('saveNotesBtn').addEventListener('click', async ()=>{
      const notes = document.getElementById('custNotes').value;
      await sb.rpc('rpc_update_customer_notes', { p_token: session.token, p_customer_id: c.id, p_notes: notes });
      await refreshState(); toast('Notiz gespeichert');
    });
    document.getElementById('resetPwBtn').addEventListener('click', async ()=>{
      const { data } = await sb.rpc('rpc_reset_customer_password', { p_token: session.token, p_customer_id: c.id });
      if(!data || !data.password){ toast('Zurücksetzen fehlgeschlagen'); return; }
      openModal(resetResultModal(c, data.password));
      document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    });
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  }));
  document.querySelectorAll('[data-cust-toggle]').forEach(b=>b.addEventListener('click', async ()=>{
    const c = custById(b.dataset.custToggle);
    await sb.rpc('rpc_toggle_customer_status', { p_token: session.token, p_customer_id: c.id });
    await refreshState(); toast(c.status==='active'?'Kunde gesperrt':'Kunde entsperrt'); renderAll();
  }));
  document.querySelectorAll('[data-cust-del]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Diesen Kunden wirklich löschen? Alle Termine bleiben zu Referenzzwecken erhalten.')) return;
    await sb.rpc('rpc_delete_customer', { p_token: session.token, p_customer_id: b.dataset.custDel });
    await refreshState(); toast('Kunde gelöscht'); renderAll();
  }));

  const profileForm = document.getElementById('profileForm');
  if(profileForm) profileForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const name = document.getElementById('pName').value.trim();
    const email = document.getElementById('pEmail').value.trim();
    const favoriteStyle = document.getElementById('pStyle').value;
    await sb.rpc('rpc_update_customer_profile', { p_token: session.token, p_name: name, p_email: email, p_favorite_style: favoriteStyle });
    await refreshState(); toast('Profil gespeichert'); renderAll();
  });
  const custPwForm = document.getElementById('custPwForm');
  if(custPwForm) custPwForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const cur = document.getElementById('cpwCurrent').value, nw = document.getElementById('cpwNew').value, nwConfirm = document.getElementById('cpwNewConfirm').value;
    if(nw !== nwConfirm){ toast('Die neuen Passwörter stimmen nicht überein.'); return; }
    const { data } = await sb.rpc('rpc_change_customer_password', { p_token: session.token, p_current: cur, p_new: nw });
    if(data && data.error){ toast('Aktuelles Passwort stimmt nicht.'); return; }
    toast('Passwort aktualisiert'); custPwForm.reset();
  });
  const custUsernameForm = document.getElementById('custUsernameForm');
  if(custUsernameForm) custUsernameForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const newUsername = document.getElementById('custUsernameInput').value.trim();
    const { data } = await sb.rpc('rpc_update_customer_username', { p_token: session.token, p_new_username: newUsername });
    if(!data || data.error === 'taken'){ toast('Dieser Benutzername ist bereits vergeben.'); return; }
    if(data.error === 'invalid_format'){ toast('Nur Buchstaben, Zahlen, "." und "_" erlaubt.'); return; }
    if(data.error === 'cooldown'){ toast('Benutzername kann nur einmal im Monat geändert werden.'); return; }
    await refreshState(); toast('Benutzername geändert'); renderView();
  });
  const reqApptBtn = document.getElementById('reqApptBtn');
  if(reqApptBtn) reqApptBtn.addEventListener('click', ()=>{ openModal(requestApptModal(null)); wireRequestModal(); });
  const reqApptBtnCal = document.getElementById('reqApptBtnCal');
  if(reqApptBtnCal) reqApptBtnCal.addEventListener('click', ()=>{ openModal(requestApptModal(selectedDay)); wireRequestModal(); });

  const prevM = document.getElementById('prevMonth'); if(prevM) prevM.addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()-1); selectedDay=null; renderView(); });
  const nextM = document.getElementById('nextMonth'); if(nextM) nextM.addEventListener('click', ()=>{ calCursor.setMonth(calCursor.getMonth()+1); selectedDay=null; renderView(); });
  document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click', ()=>{
    selectedDay = b.dataset.day;
    document.getElementById('dayDetail').innerHTML = dayDetailPanel(selectedDay, session.role==='owner');
    wireDayDetail();
    document.getElementById('dayDetail').scrollIntoView({behavior:'smooth', block:'nearest'});
  }));
  if(selectedDay){ const dd=document.getElementById('dayDetail'); if(dd){ dd.innerHTML = dayDetailPanel(selectedDay, session.role==='owner'); wireDayDetail(); } }
}

function wireRequestModal(){
  const dropZone = document.getElementById('fileDrop');
  const fileInput = document.getElementById('reqImage');
  let imageData = null;
  dropZone.addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', async ()=>{
    const f = fileInput.files[0]; if(!f) return;
    if(f.size > 8*1024*1024){ toast('Bild zu groß (max. 8 MB)'); return; }
    try {
      // downscale/compress like gallery uploads — this used to go straight into
      // the appointments table as a multi-MB data URL, bloating every state
      // refresh (including the 18s poll) enough to occasionally time out
      imageData = await decodeFileToDataUrl(f, 1000);
      const prev=document.getElementById('filePreview'); prev.src=imageData; prev.classList.remove('hidden'); dropZone.textContent='Bild ausgewählt';
    } catch(e){
      toast('Bild konnte nicht verarbeitet werden. Versuche ein anderes Foto.');
    }
  });
  const styleSelect = document.getElementById('reqStyle');
  const customField = document.getElementById('reqCustomStyleField');
  styleSelect.addEventListener('change', ()=>{
    customField.classList.toggle('hidden', styleSelect.value !== '__custom__');
  });
  document.getElementById('submitReqBtn').addEventListener('click', (e)=>withLock(e.currentTarget, async ()=>{
    const date = document.getElementById('reqDate').value;
    const from = document.getElementById('reqFrom').value;
    const to = document.getElementById('reqTo').value;
    if(toMinutes(to) <= toMinutes(from)){ toast('"Bis" muss nach "Von" liegen.'); return; }
    let style = styleSelect.value;
    if(style === '__custom__'){
      style = document.getElementById('reqCustomStyle').value.trim();
      if(!style){ toast('Bitte deinen Frisurwunsch eingeben.'); return; }
    }
    const comment = document.getElementById('reqComment').value.trim();
    const { data, error } = await sb.rpc('rpc_request_appointment', { p_token: session.token, p_date: date, p_from: from, p_to: to, p_style: style, p_comment: comment, p_image: imageData });
    if(error || !data || !data.ok){ toast('Anfrage fehlgeschlagen'); return; }
    notifyEvent('new_request', data.id);
    await refreshState(); closeModal(); toast('Anfrage gesendet');
    selectedDay = date; renderView();
  }));
}
function wireDayDetail(){
  const blockBtn = document.getElementById('blockDayBtn');
  if(blockBtn) blockBtn.addEventListener('click', ()=>{
    openModal(blockModal(selectedDay));
    const fullChk = document.getElementById('fullDayChk');
    const fromSel = document.getElementById('blockFrom'), toSel = document.getElementById('blockTo');
    fullChk.addEventListener('change', ()=>{
      if(fullChk.checked){ fromSel.value='07:00'; toSel.value='24:00'; fromSel.disabled=true; toSel.disabled=true; }
      else{ fromSel.disabled=false; toSel.disabled=false; }
    });
    document.getElementById('saveBlockBtn').addEventListener('click', (e)=>withLock(e.currentTarget, async ()=>{
      const from = fromSel.value, to = toSel.value;
      if(toMinutes(to) <= toMinutes(from)){ toast('"Bis" muss nach "Von" liegen.'); return; }
      const reason = document.getElementById('blockReason').value.trim();
      await sb.rpc('rpc_block_time', { p_token: session.token, p_date: selectedDay, p_from: from, p_to: to, p_reason: reason });
      await refreshState(); closeModal(); toast('Zeit blockiert'); renderView();
    }));
  });
  document.querySelectorAll('[data-unblock]').forEach(b=>b.addEventListener('click', (e)=>withLock(e.currentTarget, async ()=>{
    await sb.rpc('rpc_unblock', { p_token: session.token, p_id: Number(b.dataset.unblock) });
    await refreshState(); toast('Freigegeben'); renderView();
  })));
  document.querySelectorAll('[data-confirm]').forEach(b=>b.addEventListener('click', ()=>{
    const a = DATA.appointments.find(x=>String(x.id)===b.dataset.confirm);
    openModal(confirmApptModal(a));
    document.getElementById('saveConfirmBtn').addEventListener('click', (e)=>withLock(e.currentTarget, async ()=>{
      const start = document.getElementById('confirmStart').value;
      const duration = parseInt(document.getElementById('confirmDuration').value,10) || 60;
      await sb.rpc('rpc_confirm_appointment', { p_token: session.token, p_id: a.id, p_start: start, p_duration: duration });
      notifyEvent('confirmed', a.id);
      await refreshState(); closeModal(); toast('Termin bestätigt'); renderView();
    }));
  }));
  document.querySelectorAll('[data-reject-flow]').forEach(b=>b.addEventListener('click', ()=>{
    const a = DATA.appointments.find(x=>String(x.id)===b.dataset.rejectFlow);
    openModal(rejectFlowModal(a, a.status==='confirmed'));
    document.getElementById('rejectFlowCloseBtn').addEventListener('click', closeModal);
    document.getElementById('rejectNoAltBtn').addEventListener('click', (e)=>withLock(e.currentTarget, async ()=>{
      await sb.rpc('rpc_reject_appointment', { p_token: session.token, p_id: a.id });
      notifyEvent('rejected', a.id);
      await refreshState(); closeModal(); toast('Termin abgelehnt'); renderView();
    }));
    document.getElementById('rejectAltBtn').addEventListener('click', ()=>{
      openModal(proposeAltModal(a));
      document.getElementById('proposeAltCloseBtn').addEventListener('click', closeModal);
      document.getElementById('sendAltBtn').addEventListener('click', (e)=>withLock(e.currentTarget, async ()=>{
        const date = document.getElementById('altDate').value;
        const start = document.getElementById('altStart').value;
        const duration = parseInt(document.getElementById('altDuration').value,10) || 60;
        await sb.rpc('rpc_propose_alternative', { p_token: session.token, p_id: a.id, p_date: date, p_start: start, p_duration: duration });
        notifyEvent('proposed', a.id);
        await refreshState(); closeModal(); toast('Alternativtermin vorgeschlagen'); renderView();
      }));
    });
  }));
  document.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click', (e)=>withLock(e.currentTarget, async ()=>{
    const id = Number(b.dataset.reject);
    await sb.rpc('rpc_reject_appointment', { p_token: session.token, p_id: id });
    notifyEvent('proposal_declined', id);
    await refreshState(); toast('Termin abgelehnt'); renderView();
  })));
  document.querySelectorAll('[data-accept-proposal]').forEach(b=>b.addEventListener('click', (e)=>withLock(e.currentTarget, async ()=>{
    const id = Number(b.dataset.acceptProposal);
    await sb.rpc('rpc_accept_proposal', { p_token: session.token, p_id: id });
    notifyEvent('proposal_accepted', id);
    await refreshState(); toast('Termin bestätigt'); renderView();
  })));
  const reqOnDay = document.getElementById('requestOnDayBtn');
  if(reqOnDay) reqOnDay.addEventListener('click', ()=>{ openModal(requestApptModal(selectedDay)); wireRequestModal(); });
}

function hideSplash(){
  const el = document.getElementById('splashScreen');
  if(el) el.classList.add('hide');
}
function showSplash(){
  const el = document.getElementById('splashScreen');
  if(el) el.classList.remove('hide');
}

(async function boot(){
  addPasswordToggles(document.getElementById('loginScreen'));
  const resetToken = new URLSearchParams(window.location.search).get('reset');
  if(resetToken){
    document.getElementById('loginScreen').style.display='flex';
    showResetPasswordScreen(resetToken);
    hideSplash();
    return;
  }
  const savedToken = localStorage.getItem(SESSION_KEY);
  if(savedToken){
    const { data, error } = await sb.rpc('rpc_get_state', { p_token: savedToken });
    if(!error && data && !data.error){
      session = { token: savedToken, role: data.role === 'owner' ? 'owner' : 'kunde', customerId: data.customerId };
      applyState(data);
      enterApp();
      hideSplash();
      return;
    }
    localStorage.removeItem(SESSION_KEY);
  }
  document.getElementById('loginScreen').style.display='flex';
  hideSplash();
})();
</script>
